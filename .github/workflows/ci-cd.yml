name: CI/CD with ArgoCD

on:
  push:
    branches: [task]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
  pull_request:
    branches: [task]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'

jobs:
  # Job to check which files have changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            frontend:
              - 'apps/frontend/**'

  # CI: Build and Push Images
  backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: apps/backend
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and push Docker image
        id: build
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          IMAGE_URI=${{ secrets.ECR_FRONTEND_REPO }}:backend-staging-${SHORT_SHA}
          
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          
          echo "image-tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Built and pushed: $IMAGE_URI"

  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/frontend
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and push Docker image
        id: build
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          IMAGE_URI=${{ secrets.ECR_FRONTEND_REPO }}:frontend-staging-${SHORT_SHA}
          
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          
          echo "image-tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Built and pushed: $IMAGE_URI"

